<!doctype html><html><head><meta charset="utf-8"><title>Blueprint · try it</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>/* Blueprint designer mockup styles. Thin light lines on deep blue. */
:root {
  --bg: #0b1430; --panel: #0d1838; --panel2: #10204a; --line: rgba(222, 234, 255, .78);
  --faint: rgba(190, 210, 255, .22); --ink: #e8f0ff; --dim: #93a3c8; --sel: #ffe08a;
  --go: #7dffb0; --warn: #ffb35a; --bad: #ff7b7b; --cyan: #7fd4ff;
  --tgt: 32px; --row: 30px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: var(--W); height: var(--H); overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; font-size: 13px; }
button { font: inherit; color: inherit; background: none; border: 1px solid var(--faint); cursor: pointer; }
kbd { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; border: 1px solid var(--faint); border-radius: 3px; padding: 0 4px; margin: 0 1px; color: var(--ink); }
.app { position: relative; width: var(--W); height: var(--H); }
.grid { display: grid; width: 100%; height: 100%; grid-template-columns: 248px 1fr 300px; grid-template-rows: 48px 1fr 26px;
  grid-template-areas: "top top top" "left canvas right" "status status status"; }
.grid.touch { grid-template-columns: 236px 1fr 300px; grid-template-rows: 56px 1fr 28px; --tgt: 44px; --row: 44px; }

/* top bar */
.top { grid-area: top; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
.ib { height: var(--tgt); min-width: var(--tgt); padding: 0 10px; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; letter-spacing: .04em; font-size: 12.5px; }
.ib.sm { height: 26px; min-width: 26px; padding: 0 6px; border-color: transparent; }
.grid.touch .ib.sm { height: 40px; min-width: 40px; }
.ib.on { border-color: var(--cyan); color: var(--cyan); background: rgba(127, 212, 255, .08); }
.menu span { font-weight: 600; letter-spacing: .12em; }
.title { display: flex; align-items: baseline; gap: 10px; padding: 0 14px; border-left: 1px solid var(--faint); border-right: 1px solid var(--faint); height: 100%; align-items: center; }
.tl { font-size: 10px; letter-spacing: .2em; color: var(--dim); }
.tn { font-family: "IBM Plex Mono", monospace; font-size: 20px; font-weight: 500; letter-spacing: .08em; }
.tn i { color: var(--warn); font-style: normal; font-size: 12px; margin-left: 6px; vertical-align: super; }
.badge { font-size: 10px; letter-spacing: .14em; border: 1px solid var(--dim); color: var(--dim); padding: 1px 6px; border-radius: 2px; }
.badge.edit { border-color: var(--go); color: var(--go); }
.grp { display: flex; gap: 4px; }
.tog .ib { font-size: 12px; }
.spacer { flex: 1; }
.try { height: var(--tgt); padding: 0 20px; border: 1.5px solid var(--go); color: #062012; background: var(--go); font-weight: 600; letter-spacing: .16em; border-radius: 3px; font-size: 14px; }

/* panels */
.panel { background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.left { grid-area: left; border-right: 1px solid var(--line); }
.right { grid-area: right; border-left: 1px solid var(--line); }
.ph { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.phl { font-size: 18px; letter-spacing: .14em; font-weight: 500; }
.pf { margin-top: auto; padding: 6px 10px; border-top: 1px solid var(--faint); font-size: 11px; color: var(--dim); }

.typesel { display: grid; grid-template-columns: var(--tgt) 1fr var(--tgt); align-items: center; gap: 4px; padding: 8px 8px 4px; }
.arrow { height: var(--tgt); border-radius: 3px; font-size: 12px; }
.tname { position: relative; text-align: center; border: 1px solid var(--faint); border-radius: 3px; padding: 2px 0 3px; cursor: pointer; }
.tname small { display: block; font-size: 9.5px; letter-spacing: .2em; color: var(--dim); }
.tname b { font-size: 17px; letter-spacing: .12em; font-weight: 500; }
.tname .caret { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); color: var(--dim); font-size: 10px; }
.dots { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; padding: 2px 8px 8px; border-bottom: 1px solid var(--faint); }
.dot { height: 22px; font-size: 9.5px; letter-spacing: .06em; border-radius: 2px; color: var(--dim); }
.grid.touch .dot { height: 32px; }
.dot.on { border-color: var(--cyan); color: var(--cyan); background: rgba(127, 212, 255, .1); }
.listwrap { flex: 1; display: grid; grid-template-columns: 1fr 18px; min-height: 0; }
.grid.touch .listwrap { grid-template-columns: 1fr 24px; }
.list { overflow: hidden; padding: 6px 4px 6px 8px; display: flex; flex-direction: column; gap: 6px; }
.card { display: grid; grid-template-columns: 64px 1fr 30px; gap: 8px; align-items: center; border: 1px solid var(--faint); border-radius: 3px; padding: 6px; min-height: 76px; }
.grid.touch .card { grid-template-columns: 64px 1fr 44px; }
.card:hover { border-color: var(--line); }
.card.picked { border: 1px dashed var(--go); background: rgba(125, 255, 176, .05); }
.thumb { height: 58px; display: flex; align-items: center; justify-content: center; }
.ico { width: 64px; height: 56px; fill: none; stroke: var(--ink); stroke-width: 1.4; }
.cname { font-size: 14px; letter-spacing: .03em; }
.cstat { white-space: nowrap; font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--dim); }
.add { height: 30px; border-radius: 3px; font-size: 16px; color: var(--cyan); border-color: rgba(127, 212, 255, .4); }
.grid.touch .add { height: 44px; }
.sbar { display: grid; grid-template-rows: 18px 1fr 18px; border-left: 1px solid var(--faint); }
.grid.touch .sbar { grid-template-rows: 32px 1fr 32px; }
.sbtn { border: none; font-size: 8px; color: var(--dim); }
.strack { position: relative; margin: 2px 4px; }
.sthumb { position: absolute; left: 0; right: 0; border: 1px solid var(--line); border-radius: 2px;
  background: repeating-linear-gradient(135deg, transparent 0 3px, rgba(222, 234, 255, .35) 3px 4px); }

/* canvas */
.canvas { grid-area: canvas; position: relative; overflow: hidden; background: #0a1330; }
.bp { position: absolute; inset: 0; }
.scale text, .ghostlbl, .snaplbl, .warnlbl, .rocklbl, .co1, .co2 { font-family: "IBM Plex Mono", monospace; font-size: 11px; fill: var(--ink); }
.snaplbl { fill: var(--go); } .warnlbl { fill: var(--warn); } .ghostlbl { fill: #9fc0ff; font-size: 13px; letter-spacing: .2em; }
.co1 { fill: var(--sel); font-size: 11.5px; } .co2 { fill: var(--dim); }
.rocklbl { fill: #8d95b8; letter-spacing: .1em; }
.stats { position: absolute; top: 10px; right: 10px; background: rgba(11, 20, 48, .92); border: 1px solid var(--line); min-width: 268px; }
.sh { padding: 5px 10px; border-bottom: 1px solid var(--faint); font-size: 12px; letter-spacing: .18em; }
.sh small { letter-spacing: .04em; color: var(--dim); margin-left: 6px; font-size: 10.5px; }
.stats table { border-collapse: collapse; width: 100%; }
.stats th { text-align: left; font-weight: 400; color: var(--dim); padding: 2px 10px; font-size: 12px; white-space: nowrap; }
.stats td { font-family: "IBM Plex Mono", monospace; font-size: 12px; padding: 2px 6px; text-align: right; white-space: nowrap; }
.stats td.d { width: 46px; font-size: 11px; padding-right: 10px; }
.d.up { color: var(--go); } .d.down { color: var(--bad); }
.tblock { position: absolute; right: 10px; bottom: 10px; display: grid; grid-template-columns: auto auto; border: 1px solid var(--line); background: rgba(11, 20, 48, .9); }
.tblock div { padding: 3px 10px; border: .5px solid var(--faint); }
.tblock small { display: block; font-size: 9px; letter-spacing: .2em; color: var(--dim); }
.tblock b { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 12px; }
.zoom { position: absolute; left: 10px; top: 10px; display: flex; flex-direction: column; border: 1px solid var(--line); background: rgba(11, 20, 48, .9); }
.zoom button { width: var(--tgt); height: var(--tgt); border: none; font-size: 16px; }
.zl { font-family: "IBM Plex Mono", monospace; font-size: 10px; text-align: center; padding: 2px 0; border-top: 1px solid var(--faint); border-bottom: 1px solid var(--faint); }

/* properties */
.selhead { display: flex; gap: 10px; padding: 8px 10px; align-items: center; border-bottom: 1px solid var(--faint); }
.selhead b { font-size: 16px; font-weight: 500; letter-spacing: .03em; display: block; }
.selhead small { color: var(--dim); font-size: 11.5px; }
.swatch { width: 14px; height: 30px; border-radius: 2px; opacity: .8; flex: none; }
.swatch.weld { background: radial-gradient(circle, var(--sel) 30%, transparent 32%), transparent; border: 1px solid var(--sel); border-radius: 50%; width: 22px; height: 22px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--faint); }
.tabs button { height: var(--tgt); border: none; border-right: 1px solid var(--faint); font-size: 11.5px; letter-spacing: .14em; color: var(--dim); }
.tabs button.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--cyan); }
.fields { flex: 1; overflow: hidden; padding: 2px 0; }
.field { padding: 5px 10px 6px; border-bottom: 1px solid rgba(190, 210, 255, .08); }
.fl { display: flex; align-items: center; gap: 6px; }
.fl label { font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); cursor: ew-resize; }
.field.changed .fl label::before { content: "● "; color: var(--warn); font-size: 9px; vertical-align: 2px; }
.reset { border: none; color: var(--dim); font-size: 13px; height: 20px; padding: 0 2px; }
.val { margin-left: auto; display: flex; align-items: baseline; gap: 4px; border: 1px solid var(--faint); border-radius: 2px; padding: 1px 6px; min-width: 86px; justify-content: flex-end; background: rgba(0, 0, 0, .18); }
.grid.touch .val { min-height: 32px; align-items: center; min-width: 96px; }
.num { font-family: "IBM Plex Mono", monospace; font-size: 15px; }
.unit { font-size: 11px; color: var(--dim); min-width: 14px; }
.sl { display: grid; grid-template-columns: var(--row) 1fr var(--row); align-items: center; gap: 6px; margin-top: 4px; }
.step { height: var(--row); border-radius: 3px; font-size: 10px; color: var(--ink); }
.track { position: relative; height: var(--row); }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--line); }
.track::after { content: ""; position: absolute; left: 0; right: 0; top: calc(50% - 4px); height: 8px;
  background: repeating-linear-gradient(90deg, var(--faint) 0 1px, transparent 1px 10%); }
.fill { position: absolute; left: 0; top: calc(50% - 1px); height: 3px; background: var(--cyan); opacity: .8; }
.knob { position: absolute; top: 50%; width: 14px; height: 20px; transform: translate(-50%, -50%); border: 1.5px solid var(--ink); background: var(--panel); border-radius: 2px; z-index: 1; }
.grid.touch .knob { width: 22px; height: 30px; }
.note { font-size: 11px; color: var(--dim); margin-top: 3px; }
.derived { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--faint); }
.derived div { padding: 6px 10px; border-right: 1px solid var(--faint); }
.derived small { display: block; font-size: 9.5px; letter-spacing: .16em; color: var(--dim); }
.derived b { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 13px; }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px 10px; border-top: 1px solid var(--faint); }
.actions button { height: var(--tgt); border-radius: 3px; font-size: 12.5px; }
.danger { color: var(--bad); border-color: rgba(255, 123, 123, .45) !important; }
.joins { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
.chip { border-color: var(--c); color: var(--c); border-radius: 12px; padding: 3px 10px; font-size: 12px; }
.seg { display: grid; grid-template-columns: auto repeat(4, 1fr); gap: 3px; padding: 4px 10px 8px; align-items: center; border-bottom: 1px solid var(--faint); }
.seg span { font-size: 11px; letter-spacing: .1em; color: var(--dim); margin-right: 4px; text-transform: uppercase; }
.seg button { height: 28px; border-radius: 2px; font-size: 11.5px; }
.seg button.on { border-color: var(--cyan); color: var(--cyan); }
.placing { padding: 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.pl-row { font-size: 13px; color: var(--dim); display: flex; gap: 8px; }
.pl-row span { width: 14px; text-align: center; }
.pl-row.ok span, .pl-row.ok b { color: var(--go); } .pl-row.warn { color: var(--warn); }

.status { grid-area: status; display: flex; align-items: center; padding: 0 12px; border-top: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--dim); gap: 4px; }
.status b { color: var(--ink); font-weight: 500; }

/* blueprints drawer */
.scrim { position: absolute; inset: 0; background: rgba(3, 6, 18, .62); }
.drawer { position: absolute; left: 0; top: 0; bottom: 0; width: 560px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.dtools { display: flex; gap: 6px; padding: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--faint); }
.dtools button { height: 32px; padding: 0 10px; border-radius: 3px; }
.dtools .primary { border-color: var(--go); color: var(--go); }
.dfilter { display: flex; gap: 4px; padding: 8px 10px; align-items: center; }
.dfilter button { height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12px; color: var(--dim); }
.dfilter button.on { border-color: var(--cyan); color: var(--cyan); }
.dfilter input { margin-left: auto; height: 28px; background: rgba(0, 0, 0, .2); border: 1px solid var(--faint); color: var(--ink); padding: 0 8px; font: inherit; width: 160px; }
.dlist { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 6px 10px; overflow: hidden; }
.dcard { display: grid; grid-template-columns: 124px 1fr; gap: 6px; border: 1px solid var(--faint); border-radius: 3px; padding: 6px; align-items: center; }
.dcard.cur { border-color: var(--cyan); }
.dcard svg { border: 1px solid var(--faint); background: #0a1330; }
.nothumb { width: 120px; height: 70px; border: 1px dashed var(--faint); color: var(--dim); font-size: 10px; display: flex; align-items: center; justify-content: center; }
.dt b { display: block; font-family: "IBM Plex Mono", monospace; font-weight: 500; letter-spacing: .06em; font-size: 13px; }
.dt small { display: block; color: var(--dim); font-size: 11px; }

/* try it */
.try-view { position: absolute; inset: 0; }
.tbar { position: absolute; left: 0; right: 0; top: 0; height: 52px; display: flex; gap: 10px; align-items: center; padding: 0 10px; background: linear-gradient(rgba(3, 5, 12, .9), rgba(3, 5, 12, 0)); }
.back { height: 40px; padding: 0 16px; border: 1.5px solid var(--cyan); color: var(--cyan); border-radius: 3px; letter-spacing: .12em; font-weight: 600; background: rgba(127, 212, 255, .08); }
.tbar .ib { height: 36px; }
.tt small { display: block; font-size: 9.5px; letter-spacing: .24em; color: var(--dim); }
.tt b { font-family: "IBM Plex Mono", monospace; font-size: 16px; letter-spacing: .08em; margin-right: 10px; }
.tt span { color: var(--dim); font-size: 12px; }
.gauges { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 0; border: 1px solid var(--faint); background: rgba(3, 5, 12, .7); }
.g { padding: 6px 12px; border-right: 1px solid var(--faint); min-width: 110px; }
.g small { display: block; font-size: 9.5px; letter-spacing: .2em; color: var(--dim); }
.g b { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 12px; }
.g b.big { font-size: 15px; }
.bar { width: 120px; height: 6px; border: 1px solid var(--faint); margin: 3px 0; }
.bar i { display: block; height: 100%; background: var(--cyan); }
.keys { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 10px; align-items: center; color: var(--dim); font-size: 12px; border: 1px solid var(--faint); padding: 8px 12px; background: rgba(3, 5, 12, .7); }
.keys b { letter-spacing: .2em; font-size: 10px; font-weight: 500; }

/* touch: tighter field rows so six fit without scrolling */
.grid.touch .card { grid-template-columns: 48px 1fr 44px; gap: 6px; padding: 4px; }
.grid.touch .ico { width: 48px; }
.grid.touch .cname { font-size: 13.5px; }
.grid.touch .field { padding: 3px 10px 4px; }
.grid.touch .fl { height: 24px; }
.grid.touch .val { min-height: 26px; }
.grid.touch .sl { margin-top: 2px; }
.grid.touch .derived div { padding: 4px 10px; }
.grid.touch .actions { padding: 6px 10px; }

:root{--W:1280px;--H:800px} </style></head><body><div class="app"><div class="try-view"><svg width="1280" height="800">
